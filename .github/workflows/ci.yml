name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: siddhant
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siddhant -d taskmanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
     SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskmanager
     SPRING_DATASOURCE_USERNAME: siddhant
     SPRING_DATASOURCE_PASSWORD: testpassword
     JWT_SECRET: ci-test-secret-key
     FRONTEND_URL: http://localhost:5173
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: ./mvnw clean test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      - name: Build Docker images
        run: docker compose build
